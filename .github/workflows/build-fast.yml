name: build-fast (smalltv only)

# Manual-only: for quick iteration on the SmallTV-Ultra (ESP8266) target
# while testing changes, without waiting on the other four targets that
# the main "build" workflow always builds together. Trigger it from the
# Actions tab: build-fast (smalltv only) -> Run workflow.
on:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (smalltv only)
        run: pio run -e smalltv

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp .pio/build/smalltv/firmware.bin dist/smalltv-mod-firmware.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-mod-firmware-fast
          path: dist/
